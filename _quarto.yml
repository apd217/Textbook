# Callout convention for this book (G10). Quarto only has five types, so pick by job:
#   important  the reader must not misunderstand this (causality warnings, order-matters rules)
#   warning    a mistake people actually make, and how to avoid it
#   note       context, history, a naming collision, a credit box
#   tip        practice advice, and the collapsible answers to self-check questions
# There is no callout-danger. It is not a Quarto type; it renders as an unstyled div and can
# lose its box entirely in the PDF pipeline. Use important.

project:
  type: book

execute:
  cache: false
  freeze: auto

book:
  output-file: Psychological_Statistics_with_R
  chapters:
    - index.qmd
    - part: "The Necessary Slog"
      chapters:
        - Ch_01_Introduction.qmd
        - Ch_02_R_Basics.qmd
        - Ch_03_Probability.qmd
        - Ch_04_Distributions.qmd
        - Ch_05_Standard_Error.qmd
        - Ch_06_One_Sample_t.qmd
        - Ch_07_Power_Effect_Size.qmd
        - Ch_08_Independent_t.qmd
        - Ch_09_Paired_t.qmd
    - part: "Putting Lines Through Things"
      chapters:
        - Ch_10_Covariance_Correlation.qmd
        - Ch_11_Intro_Regression.qmd
        - Ch_12_Categorical_Regression.qmd
        - Ch_13_Multiple_Regression.qmd
        - Ch_14_Hierarchical_Regression.qmd
        - Ch_15_Statistical_Control.qmd
        - Ch_16_Continuous_Categorical_Interaction.qmd
        - Ch_17_Categorical_Interaction.qmd
        - Ch_18_Mixed_Regression.qmd
    - part: "Okay, But What If It’s Complicated?"
      chapters:
        - Ch_19_Regression_Diagnostics.qmd
        - Ch_20_Multiple_Comparisons.qmd
        - Ch_21_Advanced_Interactions.qmd
        - Ch_22_GLM.qmd
        - Ch_23_Mediation.qmd
        - Ch_24_Moderated_Mediation.qmd
    - part: "ANOVA is dead, Long Live ANOVA"
      chapters:
        - Ch_25_ANOVA_Introduction.qmd
        - Ch_26_One_Way_ANOVA.qmd
        - Ch_27_One_Way_Follow_Ups.qmd
        - Ch_28_Two_Way_Between_ANOVA.qmd
        - Ch_29_Two_Way_Between_Follow_Ups.qmd
        - Ch_30_One_Way_Within_ANOVA.qmd
        - Ch_31_Two_Way_Within_ANOVA.qmd
        - Ch_32_Two_Way_Within_Follow_Ups.qmd
        - Ch_33_Mixed_ANOVA.qmd
  #  - part: "Mixed Models: An Ultra Quick Tour of the Basics"
  #    chapters:
  #      - Ch_33A_Mixed_Foundations.qmd
  #      - Ch_33B_Mixed_Slopes_Centering.qmd
  #      - Unfinished/Ch_33C_Mixed_Designs.qmd
  #      - Ch_33D_Mixed_Inference.qmd
    - part: "Other Statistical Creatures"
      chapters:  
        - Ch_34_Chi_Square.qmd
        - Ch_35_Nonparametric_Tests.qmd
        - Ch_36_Bootstrapping.qmd
     #  - Ch_36A_EFA.qmd
    - part: "When R Inevitably Betrays You"
      chapters:
        - Ch_37_Reporting.qmd
        - Ch_38_Tidyverse_Review.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 1
    number-sections: true
    smooth-scroll: true
    fontsize: 1.1rem
    linestretch: 1.7

  pdf:
    pdf-engine: xelatex
    documentclass: scrreprt
    toc: true
    toc-depth: 1
    number-sections: true
    include-before-body:
      - cover.tex
      - copyright.tex
    fontsize: 10pt
    fig-pos: 'H'
    include-in-header:
      text: |
        \usepackage{microtype}
        \usepackage{setspace}
        \usepackage{xcolor}
        \usepackage{booktabs}
        \usepackage{float}
        \usepackage[section]{placeins}
        \usepackage{needspace}
        \usepackage{etoolbox}
        \usepackage{tcolorbox}
        \tcbuselibrary{skins,breakable}
        \tcbset{breakable/.code={}}
        \tcbset{
          before upper={
            \small
            \setlength{\parskip}{0.65\baselineskip}
            \setlength{\parindent}{0pt}
          }
        }
        % Tables render one step down, matching the callout boxes
        \AtBeginEnvironment{longtable}{\small}
        \AtBeginEnvironment{tabular}{\small}
        \AtBeginEnvironment{tabularx}{\small}

        \setstretch{1.15}
        \geometry{top=0.62in,bottom=0.82in,left=0.62in,right=0.62in,footskip=0.34in}
        \AtBeginEnvironment{longtable}{\Needspace{10\baselineskip}}
    
        \definecolor{chapterblue}{HTML}{1F4E79}
        \definecolor{lightgray}{HTML}{F5F5F5}
    
        \setmainfont[
          Path = C:/Users/ademos/AppData/Roaming/TinyTeX/texmf-dist/fonts/opentype/public/cm-unicode/,
          UprightFont = cmunrm.otf,
          BoldFont = cmunbx.otf,
          ItalicFont = cmunti.otf,
          BoldItalicFont = cmunbi.otf
        ]{CMU Serif}
    
        \setsansfont[
          Path = C:/Users/ademos/AppData/Roaming/TinyTeX/texmf-dist/fonts/opentype/public/cm-unicode/,
          UprightFont = cmunss.otf,
          BoldFont = cmunsx.otf,
          ItalicFont = cmunsi.otf,
          BoldItalicFont = cmunso.otf
        ]{CMU Sans Serif}
    
        \addtokomafont{chapter}{\sffamily\color{chapterblue}}
        \addtokomafont{section}{\sffamily\color{chapterblue}}
        \addtokomafont{subsection}{\sffamily\color{chapterblue}}
    geometry:
      - margin=0.5in
